stages: [validate, secret-scan]

default:
  tags: ["${CI_RUNNER_TAG}"]

variables:
  TRUFFLEHOG_IMAGE: "docker.io/trufflesecurity/trufflehog@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4"

repository-integrity:
  stage: validate
  script:
    - |
      set -euo pipefail
      /usr/bin/python3 - <<'PY'
      import json
      import py_compile
      import subprocess
      from pathlib import Path

      excluded = {".git", ".venv", "node_modules", "site"}
      raw = subprocess.check_output(["git", "ls-files", "-z"])
      files = [Path(value.decode()) for value in raw.split(b"\0") if value]
      counts = {"json": 0, "python": 0, "shell": 0}
      for path in files:
          if any(part in excluded for part in path.parts) or not path.is_file():
              continue
          if path.suffix == ".json":
              json.loads(path.read_text(encoding="utf-8"))
              counts["json"] += 1
          elif path.suffix == ".py":
              py_compile.compile(str(path), doraise=True)
              counts["python"] += 1
          elif path.suffix == ".sh":
              subprocess.run(["bash", "-n", str(path)], check=True)
              counts["shell"] += 1
      print(json.dumps({"status": "ok", "validated": counts}, sort_keys=True))
      PY

trufflehog-repository:
  stage: secret-scan
  variables:
    GIT_DEPTH: "0"
  script:
    - set -euo pipefail
    - podman pull "$TRUFFLEHOG_IMAGE"
    - podman run --rm -v "$CI_PROJECT_DIR:/repo:ro,Z" "$TRUFFLEHOG_IMAGE" --json --no-verification --results=unverified --no-update --log-level=-1 --fail --fail-on-scan-errors git file:///repo >/dev/null
